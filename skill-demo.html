<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Skill 组装与解析 · 流程图</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "SF Mono", Monaco, Consolas, monospace;
    background: #0d1117;
    color: #c9d1d9;
    min-height: 100vh;
    padding: 24px;
    font-size: 14px;
  }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #f0f6fc; }
  .subtitle { color: #8b949e; font-size: 13px; margin-bottom: 20px; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 1.3fr;
    gap: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-header {
    padding: 10px 16px;
    border-bottom: 1px solid #30363d;
    background: #0d1117;
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #8b949e;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .panel-header .title { margin-left: 8px; color: #c9d1d9; font-weight: 500; }

  /* ===== 流程图 ===== */
  .flow-panel { padding: 10px; flex: 1; }
  svg { width: 100%; height: auto; display: block; }
  svg text { font-family: -apple-system, "SF Mono", Monaco, monospace; }

  .node-box rect, .node-diamond polygon, .node-oval rect {
    fill: #161b22; stroke: #30363d; stroke-width: 2;
    transition: all 0.5s ease;
  }
  .node-box text, .node-diamond text, .node-oval text {
    fill: #8b949e; font-size: 13px;
    text-anchor: middle; dominant-baseline: central;
    transition: fill 0.5s ease;
  }
  .node-box .icon, .node-diamond .icon, .node-oval .icon { font-size: 18px; text-anchor: middle; }

  .node-box.active rect, .node-diamond.active polygon, .node-oval.active rect {
    fill: #0c2d4d; stroke: #58a6ff; stroke-width: 2.5;
    filter: drop-shadow(0 0 12px rgba(88,166,255,0.4));
  }
  .node-box.active text, .node-diamond.active text, .node-oval.active text { fill: #f0f6fc; }

  .node-box.done rect, .node-diamond.done polygon, .node-oval.done rect {
    fill: #0f3d21; stroke: #3fb950; stroke-width: 2.5;
  }
  .node-box.done text, .node-diamond.done text, .node-oval.done text { fill: #7ee787; }

  .edge { fill: none; stroke: #30363d; stroke-width: 2; transition: all 0.5s ease; }
  .edge.active { stroke: #58a6ff; stroke-width: 2.5; filter: drop-shadow(0 0 6px rgba(88,166,255,0.3)); }
  .edge.done { stroke: #3fb950; }
  .edge-loop { fill: none; stroke: #30363d; stroke-width: 2; stroke-dasharray: 8 4; transition: all 0.5s ease; }
  .edge-loop.active { stroke: #f0883e; stroke-width: 2.5; stroke-dasharray: none; filter: drop-shadow(0 0 8px rgba(240,136,62,0.4)); }
  .edge-label { fill: #8b949e; font-size: 11px; text-anchor: middle; transition: fill 0.5s ease; }
  .edge-label.active { fill: #58a6ff; font-weight: 600; }
  .edge-label-yes { fill: #3fb950; font-size: 12px; font-weight: 700; }
  .edge-label-no { fill: #ff7b72; font-size: 12px; font-weight: 700; }

  .status-bar {
    margin: 0 10px 10px;
    padding: 10px 14px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    font-size: 13px;
    min-height: 42px;
    display: flex; align-items: center; gap: 8px;
  }
  .spinner {
    width: 13px; height: 13px;
    border: 2px solid #30363d; border-top-color: #58a6ff;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Tabs ===== */
  .tabs {
    display: flex;
    border-bottom: 1px solid #30363d;
    background: #0d1117;
  }
  .tab {
    padding: 10px 18px;
    font-size: 13px;
    color: #8b949e;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    user-select: none;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .tab:hover { color: #c9d1d9; }
  .tab.active {
    color: #f0f6fc;
    border-bottom-color: #58a6ff;
  }
  .tab-icon { font-size: 14px; }

  .tab-content { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .tab-content.active { display: flex; }

  /* ===== 代码展示 ===== */
  .code-view {
    padding: 16px; flex: 1; overflow-y: auto;
    scroll-behavior: smooth;
  }
  .code-view::-webkit-scrollbar { width: 8px; }
  .code-view::-webkit-scrollbar-track { background: #0d1117; }
  .code-view::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  .code-block {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .code-block-head {
    padding: 6px 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    font-size: 11px;
    color: #8b949e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .code-block-head .label { font-weight: 600; color: #c9d1d9; }
  .code-block-head .badge {
    padding: 1px 8px; border-radius: 4px;
    font-size: 10px; color: white; font-weight: 600;
  }
  pre.code {
    margin: 0;
    padding: 14px;
    font-family: "SF Mono", Monaco, monospace;
    font-size: 12px;
    line-height: 1.6;
    color: #c9d1d9;
    overflow: auto;
    white-space: pre;
  }
  /* 语法高亮 */
  .k { color: #ff7b72; }      /* keyword */
  .s { color: #a5d6ff; }      /* string */
  .c { color: #8b949e; font-style: italic; }  /* comment */
  .p { color: #d2a8ff; }      /* property / frontmatter key */
  .n { color: #79c0ff; }      /* number */
  .h { color: #7ee787; }      /* highlight (new) */
  .dim { color: #484f58; }    /* dimmed */
  .add-line {
    background: rgba(63,185,80,0.1);
    display: inline-block; width: calc(100% + 28px);
    margin: 0 -14px; padding: 0 14px;
    border-left: 2px solid #3fb950;
  }
  .new-section {
    background: rgba(88,166,255,0.08);
    display: inline-block; width: calc(100% + 28px);
    margin: 0 -14px; padding: 0 14px;
    border-left: 2px solid #58a6ff;
  }

  /* ===== 对比卡 ===== */
  .compare {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .compare-card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    overflow: hidden;
  }
  .compare-card .card-head {
    padding: 6px 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    font-size: 12px;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
  }
  .compare-card .card-body {
    padding: 10px 12px;
    font-size: 11.5px;
    line-height: 1.6;
  }
  .compare-card .card-body table { width: 100%; border-collapse: collapse; }
  .compare-card .card-body td {
    padding: 4px 6px;
    border-bottom: 1px solid #21262d;
    vertical-align: top;
  }
  .compare-card .card-body td:first-child { color: #8b949e; width: 60px; }
  .compare-card .card-body code { background: #21262d; padding: 1px 4px; border-radius: 3px; color: #f0f6fc; font-size: 10.5px; }

  .code-empty {
    color: #484f58;
    text-align: center;
    padding: 40px;
    font-size: 13px;
  }

  /* ===== 控制 ===== */
  .controls {
    max-width: 1400px; margin: 16px auto 0;
    display: flex; gap: 10px; justify-content: center;
  }
  button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    padding: 8px 18px; border-radius: 6px;
    font-family: inherit; font-size: 13px; cursor: pointer; transition: all .2s;
  }
  button:hover:not(:disabled) { background: #30363d; border-color: #58a6ff; color: #f0f6fc; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .turn-counter { text-align: center; color: #8b949e; font-size: 12px; margin-top: 10px; }
  .turn-counter .num { color: #58a6ff; font-weight: 700; font-size: 16px; }

  .kbd { display:inline-block; background:#21262d; border:1px solid #30363d; border-radius:3px; padding:0 5px; font-size:11px; color:#8b949e; }
</style>
</head>
<body>

<h1>🧩 Skill 组装与解析 · 流程图</h1>
<div class="subtitle">
  演示：<code style="background:#21262d;padding:1px 5px;border-radius:3px;color:#f0f6fc;font-size:12px;">/code-review</code> 这类 Skill 在 Claude Code 里如何从文件变成 LLM 看到的 prompt
  &nbsp;·&nbsp; 快捷键 <span class="kbd">→</span> 下一步 <span class="kbd">←</span> 上一步 <span class="kbd">P</span> 播放 <span class="kbd">R</span> 重置
</div>

<div class="layout">
  <!-- 左：流程图 -->
  <div class="panel">
    <div class="panel-header">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">Skill 流程图</span>
    </div>
    <div class="flow-panel">
      <svg viewBox="0 0 440 720" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#30363d"/>
          </marker>
          <marker id="ah-active" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
          </marker>
          <marker id="ah-loop" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#f0883e"/>
          </marker>
          <marker id="ah-done" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
            <path d="M0,0 L8,3 L0,6 Z" fill="#3fb950"/>
          </marker>
        </defs>

        <!-- 节点 -->
        <g id="n-user" class="node-oval">
          <rect x="130" y="10" width="180" height="44" rx="22"/>
          <text x="158" y="32" style="font-size:16px">👤</text>
          <text x="244" y="32" style="font-size:12px">用户 /code-review</text>
        </g>
        <g id="n-skill" class="node-box">
          <rect x="130" y="85" width="180" height="50" rx="6"/>
          <text x="160" y="110" style="font-size:18px">📄</text>
          <text x="240" y="105" style="font-size:13px;font-weight:600">Skill 源文件</text>
          <text x="240" y="123" style="font-size:10.5px;fill:#484f58">.claude/skills/xxx.md</text>
        </g>
        <g id="n-trigger" class="node-diamond">
          <polygon points="220,165 330,205 220,245 110,205"/>
          <text x="220" y="200" style="font-size:11px;font-weight:600;fill:#8b949e">触发？</text>
          <text x="220" y="216" style="font-size:10px;fill:#484f58">/name 或关键字</text>
        </g>
        <g id="n-parse" class="node-box">
          <rect x="130" y="280" width="180" height="50" rx="6"/>
          <text x="160" y="305" style="font-size:18px">📖</text>
          <text x="240" y="300" style="font-size:13px;font-weight:600">Harness 解析</text>
          <text x="240" y="318" style="font-size:10.5px;fill:#484f58">拆 frontmatter + body</text>
        </g>
        <g id="n-inject" class="node-box">
          <rect x="130" y="365" width="180" height="50" rx="6"/>
          <text x="160" y="390" style="font-size:18px">💉</text>
          <text x="240" y="385" style="font-size:13px;font-weight:600">Prompt 注入</text>
          <text x="240" y="403" style="font-size:10.5px;fill:#484f58">body → messages[0]</text>
        </g>
        <g id="n-llm" class="node-box">
          <rect x="130" y="450" width="180" height="50" rx="6"/>
          <text x="160" y="475" style="font-size:18px">🧠</text>
          <text x="240" y="470" style="font-size:14px;font-weight:600">LLM 执行</text>
          <text x="240" y="488" style="font-size:10.5px;fill:#484f58">按注入的指令行事</text>
        </g>
        <g id="n-tool" class="node-diamond">
          <polygon points="220,535 330,575 220,615 110,575"/>
          <text x="220" y="570" style="font-size:11px;font-weight:600;fill:#8b949e">调 tool？</text>
          <text x="220" y="586" style="font-size:10px;fill:#484f58">Bash/read_file…</text>
        </g>
        <g id="n-end" class="node-oval">
          <rect x="130" y="655" width="180" height="44" rx="22"/>
          <text x="158" y="677" style="font-size:16px">✅</text>
          <text x="244" y="677" style="font-size:13px">输出完成</text>
        </g>

        <!-- 边 -->
        <path id="e1" class="edge" d="M220,54 L220,85" marker-end="url(#ah)"/>
        <path id="e2" class="edge" d="M220,135 L220,165" marker-end="url(#ah)"/>
        <path id="e3" class="edge" d="M220,245 L220,280" marker-end="url(#ah)"/>
        <text id="el-e3" class="edge-label-yes" x="236" y="266">YES</text>
        <path id="e4" class="edge" d="M220,330 L220,365" marker-end="url(#ah)"/>
        <path id="e5" class="edge" d="M220,415 L220,450" marker-end="url(#ah)"/>
        <path id="e6" class="edge" d="M220,500 L220,535" marker-end="url(#ah)"/>
        <path id="e7" class="edge" d="M330,575 L395,575 L395,677 L310,677" marker-end="url(#ah)"/>
        <text id="el-e7" class="edge-label-no" x="362" y="568">NO</text>
        <path id="e-loop" class="edge-loop" d="M110,575 L50,575 L50,475 L130,475" marker-end="url(#ah-loop)"/>
        <text id="el-loop" x="38" y="525" style="fill:#30363d;font-size:11px;font-weight:700;text-anchor:middle;writing-mode:vertical-lb;transition:fill .5s">↻ 回到 LLM</text>
      </svg>
    </div>
    <div class="status-bar" id="status">
      <span style="color:#8b949e">⏸  等待启动…</span>
    </div>
    <div class="turn-counter">
      步骤：<span class="num" id="step-num">-</span> / <span id="step-total">7</span>
    </div>
  </div>

  <!-- 右：Tabs -->
  <div class="panel">
    <div class="panel-header">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">详情面板</span>
    </div>
    <div class="tabs">
      <div class="tab active" data-tab="skill">
        <span class="tab-icon">📄</span> Skill & Prompt
      </div>
      <div class="tab" data-tab="api">
        <span class="tab-icon">📡</span> API 请求
      </div>
    </div>

    <div class="tab-content active" data-tab-content="skill">
      <div class="code-view" id="skill-view">
        <div class="code-empty">
          👆 点击「下一步」开始演示<br>
          这里会实时显示 Skill 源文件、解析产物、LLM 视角
        </div>
      </div>
    </div>

    <div class="tab-content" data-tab-content="api">
      <div class="code-view" id="api-view">
        <div class="code-empty">
          👆 点击「下一步」开始演示<br>
          这里会实时显示发给 Claude API 的请求 / 响应
        </div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button id="btn-prev">◀ 上一步</button>
  <button id="btn-next">下一步 ▶</button>
  <button id="btn-play">▶▶ 自动播放</button>
  <button id="btn-reset">↺ 重置</button>
</div>

<script>
// ====== DOM ======
const skillView = document.getElementById('skill-view');
const apiView = document.getElementById('api-view');
const status = document.getElementById('status');
const stepNum = document.getElementById('step-num');

// ====== Tab 切换 ======
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(`[data-tab-content="${tab.dataset.tab}"]`).classList.add('active');
  });
});

// ====== 流程节点/边 ======
const allNodes = ['n-user','n-skill','n-trigger','n-parse','n-inject','n-llm','n-tool','n-end'];
const allEdges = ['e1','e2','e3','e4','e5','e6','e7','e-loop'];

function clearHL() {
  allNodes.forEach(id => document.getElementById(id).classList.remove('active','done'));
  allEdges.forEach(id => {
    const el = document.getElementById(id);
    el.classList.remove('active','done');
    if (id === 'e-loop') {
      el.setAttribute('marker-end', 'url(#ah-loop)');
    } else {
      el.setAttribute('marker-end', 'url(#ah)');
    }
  });
  ['el-e3','el-e7','el-loop'].forEach(id =>
    document.getElementById(id).classList.remove('active'));
}
function setNodes(mode, ids) { ids.forEach(id => document.getElementById(id).classList.add(mode)); }
function setEdges(mode, ids, loopEdges) {
  ids.forEach(id => {
    const el = document.getElementById(id);
    el.classList.add(mode);
    if (id === 'e-loop') return;
    el.setAttribute('marker-end', mode === 'active' ? 'url(#ah-active)' :
                                   mode === 'done' ? 'url(#ah-done)' : 'url(#ah)');
  });
  (loopEdges || []).forEach(id => {
    const el = document.getElementById(id);
    el.classList.add('active');
    el.setAttribute('marker-end','url(#ah-loop)');
  });
}
function setLabels(ids) { ids.forEach(id => document.getElementById(id).classList.add('active')); }
function setStatus(html) { status.innerHTML = html; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function setSkillView(html) { skillView.innerHTML = html; }
function setApiView(html) { apiView.innerHTML = html; }

// ====== 剧本 ======
const script = [
  // 0. 展示 skill 源文件
  {
    apply() {
      stepNum.textContent = '1';
      clearHL();
      setNodes('active', ['n-user','n-skill']);
      setEdges('active', ['e1']);
      setStatus('<span style="color:#79c0ff">●</span> ① Skill 源文件：一个 Markdown + YAML frontmatter 的 .md 文件');

      setSkillView(`
        <div class="code-block">
          <div class="code-block-head">
            <span class="label">📄 .claude/skills/code-review.md</span>
            <span class="badge" style="background:#1f6feb">skill 源文件</span>
          </div>
          <pre class="code"><span class="c">---</span>
<span class="p">name</span>: <span class="s">code-review</span>
<span class="p">description</span>: <span class="s">Review the current diff for correctness bugs</span>
<span class="p">when_to_use</span>: <span class="s">|</span>
  <span class="s">- User asks for a code review</span>
  <span class="s">- User says "/code-review"</span>
  <span class="s">- User mentions "review my PR"</span>
<span class="p">effort</span>: <span class="s">high</span>
<span class="c">---</span>

<span class="h"># Code Review Skill</span>

<span class="h">You are a senior engineer doing a code review.</span>

<span class="h">## Instructions</span>
<span class="h">1. Run \`git diff\` to see the changes</span>
<span class="h">2. Look for: correctness bugs, race conditions,</span>
<span class="h">   security issues, off-by-one errors</span>
<span class="h">3. For each finding, cite file:line</span>
<span class="h">4. Output as a markdown table:</span>
<span class="h">   | File | Line | Severity | Issue |</span>

<span class="c">## Severity levels</span>
<span class="c">- **CRITICAL**: data loss, security hole</span>
<span class="c">- **HIGH**: correctness bug</span>
<span class="c">- **MEDIUM**: performance, readability</span>
<span class="c">- **LOW**: style nit</span>
...
</pre>
        </div>
        <div style="color:#8b949e;font-size:12px;padding:4px 0;">
          💡 Skill 文件躺在磁盘上，harness 还没触发它。此时没有任何 API 请求。
        </div>
      `);

      setApiView(`
        <div class="code-empty">
          ⏸ Skill 还未触发，没有 API 请求
        </div>
      `);
    },
    async animate() {
      stepNum.textContent = '1';
      clearHL();
      setNodes('active', ['n-user','n-skill']);
      setEdges('active', ['e1']);
      setStatus('<div class="spinner"></div> 读取 .claude/skills/code-review.md …');
      await sleep(900);
      this.apply();
    }
  },

  // 1. 触发检测
  {
    apply() {
      stepNum.textContent = '2';
      clearHL();
      setNodes('done', ['n-user','n-skill']);
      setNodes('active', ['n-trigger']);
      setEdges('done', ['e1','e2']);
      setStatus('<span style="color:#79c0ff">●</span> ② 触发检测：用户在 prompt 里输入 <code>/code-review</code> 或提到 "review this PR"');

      setSkillView(`
        <div class="code-block">
          <div class="code-block-head">
            <span class="label">💬 用户输入（CLI 里）</span>

// ====== 控制 ======
let currentStep = -1;
let playing = false;
let cancelled = false;

function hardReset() {
  clearHL();
  setStatus('<span style="color:#8b949e">⏸  等待启动…</span>');
  stepNum.textContent = '-';
  setSkillView('<div class="code-empty">👆 点击「下一步」开始演示<br>这里会实时显示 Skill 源文件、解析产物、LLM 视角</div>');
  setApiView('<div class="code-empty">👆 点击「下一步」开始演示<br>这里会实时显示发给 Claude API 的请求 / 响应</div>');
  currentStep = -1;
}

function replayTo(n) {
  hardReset();
  for (let i = 0; i <= n; i++) script[i].apply();
  currentStep = n;
  updateButtons();
}

function nextStep() {
  if (currentStep >= script.length - 1) return;
  stopPlay();
  currentStep++;
  script[currentStep].apply();
  updateButtons();
}

function prevStep() {
  stopPlay();
  if (currentStep <= 0) { hardReset(); updateButtons(); return; }
  replayTo(currentStep - 1);
}

function updateButtons() {
  document.getElementById('btn-prev').disabled = currentStep < 0;
  document.getElementById('btn-next').disabled = currentStep >= script.length - 1;
}

async function play() {
  if (playing) return;
  playing = true; cancelled = false;
  document.getElementById('btn-play').textContent = '⏸ 暂停';
  const startFrom = currentStep + 1;
  for (let i = startFrom; i < script.length; i++) {
    if (cancelled) break;
    currentStep = i;
    updateButtons();
    await script[i].animate();
    if (cancelled) break;
    if (i < script.length - 1) await sleep(800);
  }
  playing = false; cancelled = false;
  document.getElementById('btn-play').textContent = '▶▶ 自动播放';
  updateButtons();
}

function stopPlay() {
  if (playing) {
    cancelled = true; playing = false;
    document.getElementById('btn-play').textContent = '▶▶ 自动播放';
  }
}

function reset() { stopPlay(); hardReset(); updateButtons(); }

document.getElementById('btn-prev').onclick = prevStep;
document.getElementById('btn-next').onclick = nextStep;
document.getElementById('btn-play').onclick = () => {
  if (playing) { stopPlay(); updateButtons(); } else play();
};
document.getElementById('btn-reset').onclick = reset;

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === 'r' || e.key === 'R') reset();
  else if (e.key === 'p' || e.key === 'P') {
    if (playing) { stopPlay(); updateButtons(); } else play();
  }
});

updateButtons();
</script>

</body>
</html>
